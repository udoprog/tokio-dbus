[package]
name = "tokio-dbus-runtime"
version = "0.1.1"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.90"
description = """
Runtime support for code generated by tokio-dbus-codegen.
"""
documentation = "https://docs.rs/tokio-dbus"
readme = "README.md"
homepage = "https://github.com/udoprog/tokio-dbus"
repository = "https://github.com/udoprog/tokio-dbus"
license = "MIT OR Apache-2.0"
keywords = ["async", "d-bus", "dbus", "ipc", "tokio"]
categories = ["asynchronous", "os::unix-apis"]

[dependencies]
tokio-dbus = { path = "../tokio-dbus", version = "=0.1.1" }
tokio-dbus-core = { path = "../tokio-dbus-core", version = "=0.1.1" }

[dev-dependencies]
tokio = { version = "1.34.0", features = ["full"] }
